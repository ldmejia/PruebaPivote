version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - sqlclosecheck
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Rows).Close
        - (*github.com/redis/go-redis/v9.Client).Close
        - (*github.com/rabbitmq/amqp091-go.Connection).Close
        - (*github.com/rabbitmq/amqp091-go.Channel).Close
        - (io.Closer).Close
    gosec:
      excludes:
        - G104
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      - path: cmd/coresim/
        text: G404
      - path: internal/adapters/http/auth/
        text: G117
